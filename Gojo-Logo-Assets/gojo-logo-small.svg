<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Gojo small-size app icon</title>
  <desc id="desc">An optically adjusted Gojo icon for 16 to 64 pixel rendering.</desc>
  <defs>
    <linearGradient id="bg" x1="150" y1="80" x2="870" y2="950" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#272C36"/>
      <stop offset="1" stop-color="#090B10"/>
    </linearGradient>
    <radialGradient id="core" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#EAF9FF"/>
      <stop offset="0.25" stop-color="#81D4FF"/>
      <stop offset="0.62" stop-color="#1687F2"/>
      <stop offset="1" stop-color="#0749AE"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="218" fill="url(#bg)"/>
  <rect x="35" y="35" width="954" height="954" rx="214" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="6"/>
  <circle cx="512" cy="512" r="152" fill="#168BFF" opacity="0.32" filter="url(#glow)"/>
  <path d="M733 340 A292 292 0 1 0 752 665 L752 560 L608 560"
        fill="none" stroke="#FFFFFF" stroke-width="84"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="512" cy="512" r="108" fill="url(#core)" stroke="#B9E8FF" stroke-width="7"/>
</svg>
