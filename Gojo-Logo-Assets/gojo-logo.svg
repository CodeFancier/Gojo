<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Gojo logo</title>
  <desc id="desc">A precision-drawn white G portal surrounding a luminous blue core on a dark macOS app icon.</desc>
  <defs>
    <linearGradient id="surface" x1="168" y1="72" x2="856" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#292E38"/>
      <stop offset="0.48" stop-color="#151922"/>
      <stop offset="1" stop-color="#090B10"/>
    </linearGradient>
    <radialGradient id="ambient" cx="50%" cy="48%" r="52%">
      <stop offset="0" stop-color="#168BFF" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#126FD6" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#07101D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="170" y1="70" x2="840" y2="944" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.42" stop-color="#7C8798" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="portal" x1="300" y1="220" x2="730" y2="790" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FAFCFF"/>
      <stop offset="1" stop-color="#E9F3FF"/>
    </linearGradient>
    <radialGradient id="core" cx="42%" cy="34%" r="72%">
      <stop offset="0" stop-color="#F2FBFF"/>
      <stop offset="0.12" stop-color="#BDEBFF"/>
      <stop offset="0.34" stop-color="#58C2FF"/>
      <stop offset="0.68" stop-color="#147EE8"/>
      <stop offset="1" stop-color="#0749AE"/>
    </radialGradient>
    <linearGradient id="coreRim" x1="430" y1="410" x2="590" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="0.42" stop-color="#A8E4FF" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#0A55BC" stop-opacity="0.72"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <filter id="portalShadow" x="-25%" y="-25%" width="150%" height="160%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="haloWide" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="haloNear" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="218" fill="url(#surface)" filter="url(#tileShadow)"/>
  <rect x="34" y="34" width="956" height="956" rx="216" fill="url(#ambient)"/>
  <rect x="34" y="34" width="956" height="956" rx="216" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <path d="M174 177 C258 84 766 83 850 177" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="3" stroke-linecap="round"/>

  <circle cx="512" cy="512" r="176" fill="#148BFF" opacity="0.24" filter="url(#haloWide)"/>
  <circle cx="512" cy="512" r="132" fill="#168BFF" opacity="0.25" filter="url(#haloNear)"/>
  <circle cx="512" cy="512" r="143" fill="none" stroke="#55B8FF" stroke-opacity="0.12" stroke-width="2"/>

  <path d="M733 340 A292 292 0 1 0 752 665 L752 560 L608 560"
        fill="none" stroke="#07111C" stroke-opacity="0.30" stroke-width="80"
        stroke-linecap="round" stroke-linejoin="round" transform="translate(0 10)"/>
  <path d="M733 340 A292 292 0 1 0 752 665 L752 560 L608 560"
        fill="none" stroke="url(#portal)" stroke-width="76"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#portalShadow)"/>
  <path d="M729 335 A292 292 0 0 0 590 230" fill="none" stroke="#FFFFFF" stroke-opacity="0.42" stroke-width="3" stroke-linecap="round"/>

  <circle cx="512" cy="512" r="106" fill="#062A61" opacity="0.46"/>
  <circle cx="512" cy="512" r="101" fill="url(#core)"/>
  <circle cx="512" cy="512" r="101" fill="none" stroke="url(#coreRim)" stroke-width="4"/>
  <ellipse cx="480" cy="467" rx="35" ry="19" fill="#FFFFFF" opacity="0.18" transform="rotate(-28 480 467)"/>
  <circle cx="512" cy="512" r="78" fill="none" stroke="#D8F4FF" stroke-opacity="0.10" stroke-width="2"/>
</svg>
