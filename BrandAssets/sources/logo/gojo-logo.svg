<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Gojo logo</title>
  <desc id="desc">A luminous white G portal around a blue AI core on a dark rounded app tile.</desc>
  <defs>
    <linearGradient id="surface" x1="142" y1="72" x2="872" y2="958" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#222832"/>
      <stop offset="0.46" stop-color="#111827"/>
      <stop offset="1" stop-color="#05080D"/>
    </linearGradient>
    <radialGradient id="surfaceLight" cx="38%" cy="24%" r="78%">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity=".08"/>
      <stop offset=".46" stop-color="#60A5FA" stop-opacity=".025"/>
      <stop offset="1" stop-color="#05080D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="140" y1="66" x2="884" y2="954" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FAFC" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#64748B" stop-opacity=".08"/>
      <stop offset="1" stop-color="#000000" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="portal" x1="290" y1="205" x2="736" y2="805" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".52" stop-color="#F8FAFC"/>
      <stop offset=".78" stop-color="#EAF2FF"/>
      <stop offset="1" stop-color="#BFDBFE"/>
    </linearGradient>
    <radialGradient id="core" cx="35%" cy="25%" r="78%">
      <stop offset="0" stop-color="#BFE7FF"/>
      <stop offset=".22" stop-color="#60A5FA"/>
      <stop offset=".62" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1261C9"/>
    </radialGradient>
    <filter id="tileShadow" x="-12%" y="-12%" width="124%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#000000" flood-opacity=".48"/>
    </filter>
    <filter id="blueBloom" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="blueEdge" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="13" stdDeviation="14" flood-color="#3B82F6" flood-opacity=".78"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#FFFFFF" flood-opacity=".3"/>
    </filter>
    <filter id="coreGlow" x="-150%" y="-150%" width="400%" height="400%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="23"/>
    </filter>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="218" fill="url(#surface)" filter="url(#tileShadow)"/>
  <rect x="34" y="34" width="956" height="956" rx="216" fill="url(#surfaceLight)"/>
  <rect x="34" y="34" width="956" height="956" rx="216" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <path d="M178 170 C277 89 747 88 846 170" fill="none" stroke="#F8FAFC" stroke-opacity=".08" stroke-width="3" stroke-linecap="round"/>

  <circle cx="512" cy="512" r="236" fill="#3B82F6" opacity=".055" filter="url(#blueBloom)"/>
  <g fill="none" stroke="#60A5FA">
    <circle cx="512" cy="512" r="174" stroke-opacity=".23" stroke-width="2"/>
    <circle cx="512" cy="512" r="126" stroke-opacity=".20" stroke-width="2"/>
    <circle cx="512" cy="512" r="82" stroke-opacity=".16" stroke-width="2"/>
  </g>

  <path d="M738 331 A304 304 0 1 0 760 678 L760 564 L608 564"
        fill="none" stroke="#3B82F6" stroke-opacity=".44" stroke-width="91"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#blueBloom)"/>
  <path d="M738 331 A304 304 0 1 0 760 678 L760 564 L608 564"
        fill="none" stroke="url(#portal)" stroke-width="84"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#blueEdge)"/>
  <path d="M729 315 A304 304 0 0 0 420 220"
        fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>

  <circle cx="512" cy="512" r="89" fill="#3B82F6" opacity=".5" filter="url(#coreGlow)"/>
  <circle cx="512" cy="512" r="68" fill="#071528" stroke="#60A5FA" stroke-opacity=".22" stroke-width="3"/>
  <circle cx="512" cy="512" r="58" fill="url(#core)"/>
  <circle cx="512" cy="512" r="58" fill="none" stroke="#BFDBFE" stroke-opacity=".72" stroke-width="2"/>
  <ellipse cx="493" cy="492" rx="20" ry="11" fill="#FFFFFF" opacity=".18" transform="rotate(-28 493 492)"/>
</svg>
